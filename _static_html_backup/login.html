<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HRAT - Sign In to Your Account">
  <title>Sign In - HRAT</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">
    
    <!-- Left Showcase Panel (Dark Green, Video Grid, Watermark) -->
    <div class="login-showcase">
      <!-- Ambient Glow Orbs -->
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
      <div class="glow-orb orb-3"></div>


      

      
      <!-- Perfect 4x4 Video Grid (16 squares) -->
      <div class="video-grid">
        <!-- Row 1 (4 squares) -->
        <div class="video-square" title="Video Loop 1">
          <video src="1106665_1080p_4k_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 2">
          <video src="1107191_1080p_Sanitary_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 3">
          <video src="1166776_Man_Smiling_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 4">
          <video src="1474131_People_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>

        <!-- Row 2 (4 squares) -->
        <div class="video-square" title="Video Loop 5">
          <video src="1474335_People_Lifestyle_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 6">
          <video src="4931771_Person_Human_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 7">
          <video src="4935989_People_Person_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 8">
          <video src="4962374_Woman_Portrait_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>

        <!-- Row 3 (4 squares) -->
        <div class="video-square" title="Video Loop 9">
          <video src="5369523_Coll_wavebreak_Millennial_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 10">
          <video src="5374097_Coll_wavebreak_Gen_Z_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 11">
          <video src="5381103_Coll_wavebreak_Gen_Z_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 12">
          <video src="5394500_Coll_wavebreak_People_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>

        <!-- Row 4 (4 squares) -->
        <div class="video-square" title="Video Loop 13">
          <video src="5411355_Coll_wavebreak_People_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 14">
          <video src="5431647_Coll_wavebreak_People_1280x720 (1).mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 15">
          <video src="5998547_People_Person_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 16">
          <video src="6004017_Person_People_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
      </div>
    </div>
    
    <!-- Right Login Card Panel -->
    <div class="login-form-container">
      <div class="login-card">
        
        <div class="login-card-header">
          <img src="hrat_nhrc_logo.png" alt="HRAT Logo" class="login-card-logo">
          <h2>Welcome back!</h2>
          <p>Sign in to your account to continue</p>
        </div>
        
        <!-- Social Sign-in -->
        <button type="button" class="btn-google" id="googleBtn">
          <!-- Google 'G' Logo SVG -->
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
        
        <div class="divider">or</div>
        
        <!-- Login Form -->
        <form id="loginForm">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="your email address" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" class="form-input" placeholder="your password" required autocomplete="current-password">
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                <!-- Eye icon (visible state) -->
                <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- Eye-off icon (hidden state) -->
                <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
          
          <button type="submit" class="btn-submit">Sign In</button>
        </form>
        
        <div class="login-card-footer">
          <p>Don't have an account? <a href="signup.html" class="signup-link">Sign up</a></p>
        </div>
        
      </div>
    </div>
    
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- Non-Adjacent Checkerboard Selection Algorithm ---
      // Guarantees NO TWO active videos will ever touch or sit beside each other!
      const squares = document.querySelectorAll('.video-square');
      
      const checkerboardSets = [
        [0, 2, 5, 7, 8, 10, 13, 15], // Set 0: Non-touching even cells on 4x4 grid
        [1, 3, 4, 6, 9, 11, 12, 14]  // Set 1: Non-touching odd cells on 4x4 grid
      ];
      
      let setIndex = 0;

      function pickRandom(arr, count) {
        const shuffled = [...arr].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, Math.min(count, arr.length));
      }
      
      function revealScatteredPattern() {
        const currentlyRevealed = document.querySelectorAll('.video-square.revealed');
        
        // 1. Softly fade color overlay on closing items
        currentlyRevealed.forEach(sq => {
          sq.classList.add('color-animating');
          setTimeout(() => {
            sq.classList.remove('revealed');
            setTimeout(() => {
              sq.classList.remove('color-animating');
            }, 400);
          }, 350);
        });

        // 2. Alternate set and pick 4 non-adjacent cells (strictly no 2 videos beside each other!)
        setIndex = (setIndex + 1) % checkerboardSets.length;
        const currentSet = checkerboardSets[setIndex];
        const selectedCells = pickRandom(currentSet, 4);

        selectedCells.forEach(cellIndex => {
          if (squares[cellIndex]) {
            const target = squares[cellIndex];
            target.classList.add('color-animating');
            setTimeout(() => {
              target.classList.add('revealed');
              setTimeout(() => {
                target.classList.remove('color-animating');
              }, 400);
            }, 250);
          }
        });
      }
      
      revealScatteredPattern();
      setInterval(revealScatteredPattern, 3200); // Soft, gentle rhythm

      const loginForm = document.getElementById('loginForm');
      const googleBtn = document.getElementById('googleBtn');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      function handleRedirect(e) {
        e.preventDefault();
        
        // Simple client-side visual validation
        if (e.type === 'submit') {
          if (!emailInput.value) {
            emailInput.focus();
            return;
          }
          if (!passwordInput.value) {
            passwordInput.focus();
            return;
          }
        }

        // Add a micro-animation state during transition
        const btn = e.type === 'submit' ? document.querySelector('.btn-submit') : googleBtn;
        btn.style.opacity = '0.7';
        btn.textContent = 'Authenticating...';

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      }

      loginForm.addEventListener('submit', handleRedirect);
      googleBtn.addEventListener('click', handleRedirect);

      // --- Password Visibility Toggle ---
      const passwordToggle = document.getElementById('passwordToggle');
      const eyeOpen = document.getElementById('eyeOpen');
      const eyeClosed = document.getElementById('eyeClosed');

      passwordToggle.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeOpen.style.display = isPassword ? 'none' : 'block';
        eyeClosed.style.display = isPassword ? 'block' : 'none';
        passwordToggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    });
  </script>
</body>
</html>
