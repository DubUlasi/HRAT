<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HRAT - Create Your Account">
  <title>Sign Up - HRAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">
    
    <!-- Left Showcase Panel (Dark Green, 4x4 Video Grid, Watermark) -->
    <div class="login-showcase">
      <!-- Ambient Glow Orbs -->
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
      <div class="glow-orb orb-3"></div>

      <!-- Perfect 4x4 Video Grid (16 squares) -->
      <div class="video-grid">
        <!-- Row 1 (4 squares) -->
        <div class="video-square" title="Video Loop 1">
          <video src="1106665_1080p_4k_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 2">
          <video src="1107191_1080p_Sanitary_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 3">
          <video src="1166776_Man_Smiling_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 4">
          <video src="1474131_People_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>

        <!-- Row 2 (4 squares) -->
        <div class="video-square" title="Video Loop 5">
          <video src="1474335_People_Lifestyle_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 6">
          <video src="4931771_Person_Human_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 7">
          <video src="4935989_People_Person_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 8">
          <video src="4962374_Woman_Portrait_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>

        <!-- Row 3 (4 squares) -->
        <div class="video-square" title="Video Loop 9">
          <video src="5369523_Coll_wavebreak_Millennial_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 10">
          <video src="5374097_Coll_wavebreak_Gen_Z_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 11">
          <video src="5381103_Coll_wavebreak_Gen_Z_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 12">
          <video src="5394500_Coll_wavebreak_People_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>

        <!-- Row 4 (4 squares) -->
        <div class="video-square" title="Video Loop 13">
          <video src="5411355_Coll_wavebreak_People_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 14">
          <video src="5431647_Coll_wavebreak_People_1280x720 (1).mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 15">
          <video src="5998547_People_Person_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="video-square" title="Video Loop 16">
          <video src="6004017_Person_People_1280x720.mp4" autoplay loop muted playsinline></video>
        </div>
      </div>
    </div>
    
    <!-- Right Sign Up Card Panel -->
    <div class="login-form-container signup-card-container">
      <div class="login-card">
        
        <div class="login-card-header">
          <img src="hrat_nhrc_logo.png" alt="HRAT Logo" class="login-card-logo">
          <h2>Sign Up</h2>
          <p>Create your account to submit and track complaints</p>
        </div>
        
        <!-- Sign Up Form (2-column side by side grid) -->
        <form id="signupForm" class="form-grid-2col">
          
          <!-- Row 1: First Name & Last Name -->
          <div class="form-group">
            <label for="firstName" class="form-label">First Name <span class="req">*</span></label>
            <input type="text" id="firstName" class="form-input" placeholder="First Name" required autocomplete="given-name">
          </div>

          <div class="form-group">
            <label for="lastName" class="form-label">Last Name <span class="req">*</span></label>
            <input type="text" id="lastName" class="form-input" placeholder="Last Name" required autocomplete="family-name">
          </div>

          <!-- Row 2: Email & Phone Number -->
          <div class="form-group">
            <label for="email" class="form-label">Email <span class="req">*</span></label>
            <input type="email" id="email" class="form-input input-blue" placeholder="susan@example.com" value="susan@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="phone" class="form-label">Phone Number <span class="req">*</span></label>
            <input type="tel" id="phone" class="form-input" placeholder="Phone Number" required autocomplete="tel">
          </div>

          <!-- Row 3: Gender (Full width on its own line) -->
          <div class="form-group full-width">
            <label for="gender" class="form-label">Gender <span class="req">*</span></label>
            <select id="gender" class="form-select" required>
              <option value="" disabled selected>-- Select Gender --</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="rather_not_say">I'd rather not say</option>
            </select>
          </div>

          <!-- Row 4: Password & Confirm Password (Side-by-Side on the same line!) -->
          <div class="form-group">
            <label for="password" class="form-label">Password <span class="req">*</span></label>
            <div class="password-wrapper">
              <input type="password" id="password" class="form-input input-blue" placeholder="••••••••••••" value="password123" required autocomplete="new-password">
              <button type="button" class="password-toggle" id="passwordToggle1" aria-label="Toggle password visibility">
                <svg id="eye1Open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eye1Closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password <span class="req">*</span></label>
            <div class="password-wrapper">
              <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm Password" required autocomplete="new-password">
              <button type="button" class="password-toggle" id="passwordToggle2" aria-label="Toggle confirm password visibility">
                <svg id="eye2Open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eye2Closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
          
          <div class="full-width">
            <button type="submit" class="btn-submit-slate">Submit</button>
          </div>
        </form>
        
        <div class="login-card-footer">
          <p>Already have an Account? <a href="login.html" class="signup-link">Sign in</a></p>
        </div>
        
      </div>
    </div>
    
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- Non-Adjacent Checkerboard Selection Algorithm ---
      const squares = document.querySelectorAll('.video-square');
      
      const checkerboardSets = [
        [0, 2, 5, 7, 8, 10, 13, 15], // Set 0: Non-touching even cells on 4x4 grid
        [1, 3, 4, 6, 9, 11, 12, 14]  // Set 1: Non-touching odd cells on 4x4 grid
      ];
      
      let setIndex = 0;

      function pickRandom(arr, count) {
        const shuffled = [...arr].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, Math.min(count, arr.length));
      }
      
      function revealScatteredPattern() {
        const currentlyRevealed = document.querySelectorAll('.video-square.revealed');
        
        currentlyRevealed.forEach(sq => {
          sq.classList.add('color-animating');
          setTimeout(() => {
            sq.classList.remove('revealed');
            setTimeout(() => {
              sq.classList.remove('color-animating');
            }, 400);
          }, 350);
        });

        setIndex = (setIndex + 1) % checkerboardSets.length;
        const currentSet = checkerboardSets[setIndex];
        const selectedCells = pickRandom(currentSet, 4);

        selectedCells.forEach(cellIndex => {
          if (squares[cellIndex]) {
            const target = squares[cellIndex];
            target.classList.add('color-animating');
            setTimeout(() => {
              target.classList.add('revealed');
              setTimeout(() => {
                target.classList.remove('color-animating');
              }, 400);
            }, 250);
          }
        });
      }
      
      revealScatteredPattern();
      setInterval(revealScatteredPattern, 3200);

      const signupForm = document.getElementById('signupForm');

      signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = signupForm.querySelector('.btn-submit-slate');
        btn.style.opacity = '0.7';
        btn.textContent = 'Submitting...';

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      });

      // --- Eye Toggles ---
      function setupToggle(btnId, inputId, openId, closedId) {
        const btn = document.getElementById(btnId);
        const inp = document.getElementById(inputId);
        const openSvg = document.getElementById(openId);
        const closedSvg = document.getElementById(closedId);
        if (btn && inp) {
          btn.addEventListener('click', () => {
            const isPw = inp.type === 'password';
            inp.type = isPw ? 'text' : 'password';
            openSvg.style.display = isPw ? 'none' : 'block';
            closedSvg.style.display = isPw ? 'block' : 'none';
          });
        }
      }
      setupToggle('passwordToggle1', 'password', 'eye1Open', 'eye1Closed');
      setupToggle('passwordToggle2', 'confirmPassword', 'eye2Open', 'eye2Closed');
    });
  </script>

</body>
</html>
